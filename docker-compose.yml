services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dass
      POSTGRES_PASSWORD: dass
      POSTGRES_DB: dass_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dass -d dass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
